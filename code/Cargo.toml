[package]
name = "code"
version = "0.1.0"
edition = "2021"

[dependencies]
rain = { git = "ssh://git@github.com/rain-project/rain.git" }
drop = { git = "ssh://git@github.com/rain-project/drop.git" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
